name: Fork debug build

# Builds a debug APK and uploads it as a workflow artifact, so you can sideload and test a
# branch without an Android SDK on your own machine.
#
# Run it from the Actions tab (Run workflow), or let it fire on a push to a branch.
# The debug build uses the `.debug` application ID, so it installs alongside a release
# NewTube instead of clashing with it. It is signed with the fork's permanent key (the
# FORK_KEYSTORE_* secrets, as the release workflow) so every test build installs over the
# previous one and keeps its sign-in; without the secrets (a fork) it falls back to a
# one-off debug key.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.FORK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning title=No signing key::Debug build signed with a one-off key; it will not install over an earlier test build."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=newtube"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build the debug APKs
        run: |
          set -o pipefail
          # -PdebugSuffix: the .debug app id even with the permanent key (beside the release app).
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug -PdebugSuffix 2>&1 | tee build.log

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      # A failed build's errors as annotations too, so they can be read without the full log.
      - name: Report build errors
        if: failure()
        run: |
          # One annotation (GitHub keeps only a few per step): the errors, newlines escaped.
          msg=$(grep -a -E "error:|^e: |ERROR:|What went wrong|^\* What|\.java:[0-9]+:" -A3 build.log | grep -av "^Note:" | head -80)
          msg=${msg//'%'/'%25'}
          msg=${msg//$'\n'/'%0A'}
          echo "::error title=Build errors::${msg}"

      - name: List what was built
        run: ls -l smarttubetv/build/outputs/renamed_apks/stmobileDebug/

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: NewTube-debug-${{ github.sha }}
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk
          if-no-files-found: error
          retention-days: 14
