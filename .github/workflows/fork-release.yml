name: Fork release

# Run from the Actions tab: builds the APKs and attaches them to a GitHub release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        default: "v1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build the APKs
        run: ./gradlew --no-daemon :smarttubetv:assembleStmobileDebug

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l smarttubetv/build/outputs/renamed_apks/stmobileDebug/
          gh release create "${{ inputs.tag }}" --target "$GITHUB_SHA" smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk \
            --repo "$GITHUB_REPOSITORY" --title "NewTube+ 1.0" --notes-file RELEASE_NOTES.md
